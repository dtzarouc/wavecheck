[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "wavecheck"
version = "0.1.0"
description = "Physics-verified tests of language models using exact Mie scattering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dimitrios C. Tzarouchis" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
ml = ["torch>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.5", "miepython>=3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/wavecheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
